name: BottleTalk-Feed-Service

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_FEED_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_FEED_SSH_KEY }}
          script: |
            cd /home/ec2-user/bottle-talk/bt-feed-service
            ./pull.sh